<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-YcV/wzRnKxxeRkwt5cOMmzD82X4DtOfuXle048C+dbE='; style-src 'sha256-SwU/mGC/fPgpRkcEFMbHAOTt2OseHjzqnuBym4aPJ0c='; connect-src https://functions.yandexcloud.net; base-uri 'none'; form-action 'none'">
  <title>Проверка Yandex Cloud — Форма Дома</title>
  <meta name="yandex-function-url" content="https://functions.yandexcloud.net/d4ec2iug6085c9b5re53">
  <style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: #f2ede3;
  color: #232b23;
  font: 1rem/1.55 system-ui, sans-serif;
  padding: clamp(1rem, 5vw, 4rem);
}
main {
  max-width: 42rem;
  margin: 0 auto;
  padding: clamp(1rem, 5vw, 3rem);
  background: #fffaf1;
  border: 1px solid #d9d9c9;
  border-radius: 1.5rem;
}
.brand { margin-top: 0; color: #405644; font-weight: 700; }
h1 { font: 600 clamp(1.85rem, 6vw, 3.2rem)/1.12 Georgia, serif; margin: 0; }
button {
  border: 0;
  border-radius: .75rem;
  background: #395542;
  color: white;
  font: inherit;
  font-weight: 650;
  min-height: 48px;
  padding: .75rem 1rem;
  cursor: pointer;
}
button:disabled { opacity: .75; cursor: wait; }
button:focus-visible { outline: 3px solid #395542; outline-offset: 4px; }
dl { margin-bottom: 0; }
dl div { border-top: 1px solid #d9d9c9; padding: .5rem 0; }
dt { color: #405644; }
dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
</style>
</head>
<body>
  <main>
    <p class="brand">Форма Дома</p>
    <h1>Проверка соединения</h1>
    <p>Кнопка отправляет один GET из GitHub Pages в Yandex Cloud Functions. Лимит ожидания — 10 секунд.</p>
    <button id="check" type="button">Проверить соединение с сервером</button>
    <p id="state" role="status">Проверка ещё не запускалась.</p>
    <dl>
      <div><dt>Начало (UTC)</dt><dd id="started">—</dd></div>
      <div><dt>HTTP-статус</dt><dd id="status">—</dd></div>
      <div><dt>До заголовков</dt><dd id="headers">—</dd></div>
      <div><dt>Общая длительность</dt><dd id="duration">—</dd></div>
      <div><dt>Чтение JSON</dt><dd id="json">—</dd></div>
      <div><dt>Категория ошибки</dt><dd id="error">—</dd></div>
    </dl>
  </main>
<script>
const button = document.getElementById("check");
const fields = Object.fromEntries(
  ["state", "started", "status", "headers", "duration", "json", "error"]
    .map(id => [id, document.getElementById(id)])
);

const elapsed = start => `${Math.round(performance.now() - start)} мс`;

button.addEventListener("click", async () => {
  if (button.disabled) return;
  button.disabled = true;
  for (const field of Object.values(fields)) field.textContent = "—";
  const configured = document.querySelector('meta[name="yandex-function-url"]').content.trim();
  if (!/^https:\/\/functions\.yandexcloud\.net\/[a-z0-9]+$/.test(configured)) {
    fields.state.textContent = "Укажите ссылку для вызова из Yandex Cloud Console.";
    fields.error.textContent = "configuration_error";
    button.disabled = false;
    return;
  }
  fields.state.textContent = "Проверяем соединение…";
  fields.started.textContent = new Date().toISOString();
  const start = performance.now();
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 10000);
  let phase = "headers";

  try {
    const response = await fetch(configured, {
      method: "GET",
      credentials: "omit",
      cache: "no-store",
      redirect: "error",
      signal: controller.signal
    });
    fields.status.textContent = String(response.status);
    fields.headers.textContent = elapsed(start);
    if (!response.ok) {
      fields.error.textContent = "http_error";
      fields.state.textContent = "Сервер вернул ошибку HTTP.";
      return;
    }

    phase = "json";
    const result = await response.json();
    fields.json.textContent = "Завершено";
    if (result?.ok !== true || result?.check !== "yandex-cloud-connectivity") {
      fields.error.textContent = "unexpected_response";
      fields.state.textContent = "Получен неожиданный ответ сервера.";
      return;
    }
    fields.state.textContent = "Соединение подтверждено.";
  } catch {
    if (phase === "json") fields.json.textContent = "Не завершено";
    fields.error.textContent = controller.signal.aborted
      ? "timeout"
      : phase === "json" ? "response_read_error" : "network/CORS";
    fields.state.textContent = controller.signal.aborted
      ? "Время ожидания истекло."
      : "Не удалось завершить проверку.";
  } finally {
    clearTimeout(timer);
    fields.duration.textContent = elapsed(start);
    button.disabled = false;
  }
});
</script>
</body>
</html>
